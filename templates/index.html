<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3e;
      --accent:  #6c63ff;
      --accent2: #00d4aa;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --danger:  #ff6b6b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header h1 span { color: var(--accent); }
    #total-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .header-settings-link {
      margin-left: auto;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.15s;
    }
    .header-settings-link:hover { color: var(--text); border-color: var(--accent); }

    /* ── Controls Row 1 ── */
    .controls {
      padding: 12px 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .controls input,
    .controls select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .controls input { width: 240px; }
    .controls input::placeholder { color: var(--muted); }
    .controls input:focus,
    .controls select:focus { border-color: var(--accent); }
    .controls select option { background: var(--surface); }

    /* toggle buttons */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toggle-btn.active-visa {
      border-color: #f87171;
      background: #2a1414;
      color: #fca5a5;
    }
    .toggle-btn.active-remote {
      border-color: #4ade80;
      background: #0f2a1a;
      color: #86efac;
    }

    .sort-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ── Controls Row 2 ── */
    .controls-row2 {
      padding: 10px 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    /* Pill groups */
    .pill-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .pill-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 4px;
      white-space: nowrap;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* dismissed toggle */
    .dismissed-toggle {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .dismissed-toggle.active {
      border-color: #f87171;
      background: #2a1414;
      color: #fca5a5;
    }

    /* ── Stats strip ── */
    .stats-strip {
      padding: 10px 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .stats-strip strong { color: var(--accent2); }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      padding: 20px 32px;
    }
    table { width: 100%; border-collapse: collapse; }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface); }
    tbody td { padding: 12px 14px; vertical-align: top; }

    /* dismissed rows */
    tbody tr.dismissed {
      opacity: 0.4;
    }
    tbody tr.dismissed td { text-decoration: line-through; }
    tbody tr.dismissed td.no-strike { text-decoration: none; }

    .job-title { font-weight: 600; max-width: 360px; }
    .job-title a { color: var(--text); text-decoration: none; }
    .job-title a:hover { color: var(--accent); }
    .job-snippet {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      max-width: 360px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* new badge */
    .new-badge {
      display: inline-block;
      background: var(--accent2);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      vertical-align: middle;
      margin-left: 6px;
    }

    /* tags */
    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      margin: 2px 2px 0 0;
    }
    .tag-discipline { background: #1e1b4b; color: #a5b4fc; }
    .tag-location   { background: #0f2a25; color: #6ee7b7; }
    .tag-remote     { background: #0f2a1a; color: #86efac; }
    .tag-visa       { background: #2a1414; color: #fca5a5; }
    .tag-singapore  { background: #1a2035; color: #7dd3fc; }

    .date-cell  { color: var(--muted); white-space: nowrap; font-size: 12px; }
    .seen-cell  { color: var(--muted); white-space: nowrap; font-size: 11px; }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .link-btn:hover { background: var(--accent); color: #fff; }

    /* result count */
    .result-count { font-size: 12px; color: var(--muted); padding: 0 32px 10px; }

    /* ── AI chip strip ── */
    .ai-strip {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .ai-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: default;
    }
    .ai-chip-disqualifier { background: #3b0f0f; color: #fca5a5; border: 1px solid #7f1d1d; }
    .ai-chip-caution      { background: #2a1f00; color: #fcd34d; border: 1px solid #78350f; }
    .ai-chip-match        { background: #0f2a1a; color: #86efac; border: 1px solid #14532d; }
    .ai-chip-req          { background: #1e1b4b; color: #c4b5fd; border: 1px solid #3730a3; }
    .ai-empty {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      margin-top: 6px;
    }
    .ai-empty a { color: var(--accent); }

    /* ── Tracking cell ── */
    .tracking-cell { min-width: 160px; }
    .status-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
      margin-bottom: 6px;
    }
    .status-select:focus { border-color: var(--accent); }
    .status-select[data-status="interested"] { border-color: #6366f1; color: #a5b4fc; }
    .status-select[data-status="applied"]    { border-color: #0284c7; color: #7dd3fc; }
    .status-select[data-status="interviewing"] { border-color: #d97706; color: #fcd34d; }
    .status-select[data-status="offer"]      { border-color: #16a34a; color: #86efac; }
    .status-select[data-status="rejected"]   { border-color: #dc2626; color: #fca5a5; }
    .status-select[data-status="dismissed"]  { border-color: #4b5563; color: #9ca3af; }
    .notes-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      resize: vertical;
      min-height: 48px;
      transition: border-color 0.15s;
    }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-textarea::placeholder { color: var(--muted); }

    /* ── Empty / loading ── */
    .empty { text-align: center; padding: 80px 0; color: var(--muted); }
    .empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

    .spinner { display: flex; justify-content: center; padding: 60px; }
    .spinner::after {
      content: '';
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1><span>&#9680;</span> Job Board</h1>
  <span id="total-badge">…</span>
  <a href="/settings" class="header-settings-link">Settings</a>
</header>

<!-- Row 1: existing filters -->
<div class="controls">
  <input id="search" type="search" placeholder="Search title or snippet…" />

  <select id="filter-discipline">
    <option value="">All Disciplines</option>
    {% for disc in disciplines %}
    <option value="{{ disc }}">{{ disc }}</option>
    {% endfor %}
  </select>

  <select id="filter-location">
    <option value="">All Locations</option>
    {% for loc in locations %}
    <option value="{{ loc }}">{{ loc }}</option>
    {% endfor %}
  </select>

  <button class="toggle-btn" id="btn-visa"   onclick="toggleFilter('visa')">Visa Sponsored</button>
  <button class="toggle-btn" id="btn-remote" onclick="toggleFilter('remote')">Remote</button>

  <div class="sort-group">
    Sort
    <select id="sort-select">
      <option value="date">Newest first</option>
      <option value="title">Title A–Z</option>
    </select>
  </div>
</div>

<!-- Row 2: status pills, date pills, show-dismissed toggle -->
<div class="controls-row2">
  <div class="pill-group">
    <span class="pill-group-label">Status</span>
    <button class="pill active" data-group="status" data-value="">All</button>
    <button class="pill" data-group="status" data-value="interested">Interested</button>
    <button class="pill" data-group="status" data-value="applied">Applied</button>
    <button class="pill" data-group="status" data-value="interviewing">Interviewing</button>
    <button class="pill" data-group="status" data-value="offer">Offer</button>
    <button class="pill" data-group="status" data-value="rejected">Rejected</button>
  </div>

  <div class="pill-group" style="margin-left: 16px;">
    <span class="pill-group-label">Date</span>
    <button class="pill active" data-group="days" data-value="">Any time</button>
    <button class="pill" data-group="days" data-value="1">Today</button>
    <button class="pill" data-group="days" data-value="2">2 days</button>
    <button class="pill" data-group="days" data-value="3">3 days</button>
    <button class="pill" data-group="days" data-value="7">This week</button>
  </div>

  <button class="dismissed-toggle" id="btn-dismissed">Show Dismissed</button>
</div>

<div class="stats-strip" id="stats-strip">Loading…</div>
<div class="result-count" id="result-count"></div>

<div class="table-wrap">
  <div class="spinner" id="spinner"></div>
  <table id="jobs-table" style="display:none">
    <thead>
      <tr>
        <th>#</th>
        <th>Job</th>
        <th>Discipline</th>
        <th>Tags</th>
        <th>Published</th>
        <th>Seen</th>
        <th>Track</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="jobs-body"></tbody>
  </table>
  <div class="empty" id="empty-state" style="display:none">
    <h2>No jobs found</h2>
    <p>Try adjusting your filters.</p>
  </div>
</div>

<script>
  const searchEl    = document.getElementById('search');
  const discEl      = document.getElementById('filter-discipline');
  const locationEl  = document.getElementById('filter-location');
  const sortEl      = document.getElementById('sort-select');
  const tbody       = document.getElementById('jobs-body');
  const table       = document.getElementById('jobs-table');
  const spinner     = document.getElementById('spinner');
  const emptyState  = document.getElementById('empty-state');
  const badge       = document.getElementById('total-badge');
  const statsStrip  = document.getElementById('stats-strip');
  const resultCount = document.getElementById('result-count');
  const btnDismissed = document.getElementById('btn-dismissed');

  let filters = { visa: false, remote: false };
  let showDismissed = false;
  let debounceTimer = null;

  // ── Pill group state ──
  function getActivePill(group) {
    const active = document.querySelector(`.pill[data-group="${group}"].active`);
    return active ? active.dataset.value : '';
  }

  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const group = pill.dataset.group;
      document.querySelectorAll(`.pill[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      loadJobs();
    });
  });

  // ── Dismissed toggle ──
  btnDismissed.addEventListener('click', () => {
    showDismissed = !showDismissed;
    btnDismissed.classList.toggle('active', showDismissed);
    loadJobs();
  });

  // ── Existing toggles ──
  function toggleFilter(key) {
    filters[key] = !filters[key];
    const btn = document.getElementById(`btn-${key}`);
    btn.classList.toggle(`active-${key}`, filters[key]);
    loadJobs();
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function locationTags(job) {
    const tags = [];
    const loc = (job.location || '').toLowerCase();
    if (loc === 'singapore' || loc.includes('singapore')) {
      tags.push('<span class="tag tag-singapore">Singapore</span>');
    } else if (loc.includes('visa')) {
      // handled by visa badge below
    } else if (loc !== 'remote') {
      tags.push(`<span class="tag tag-location">${esc(job.location)}</span>`);
    }
    if (job.visa_sponsored) tags.push('<span class="tag tag-visa">Visa Sponsor</span>');
    if (job.remote_ok)      tags.push('<span class="tag tag-remote">Remote</span>');
    return tags.join(' ');
  }

  function formatDate(d) {
    if (!d) return '<span style="color:var(--border)">—</span>';
    return esc(d.slice(0, 10));
  }

  // ── AI analysis chip strip ──
  const MAX_CHIP_LEN = 45;
  function chipLabel(text) {
    // Truncate long labels; show full text on hover via title attribute.
    return text.length > MAX_CHIP_LEN ? text.slice(0, MAX_CHIP_LEN - 1) + '…' : text;
  }

  function renderAnalysis(aiJson) {
    if (!aiJson) {
      return `<div class="ai-empty">No AI analysis — <a href="/settings">set up your profile</a> to enable screening.</div>`;
    }

    let analysis;
    try {
      analysis = typeof aiJson === 'string' ? JSON.parse(aiJson) : aiJson;
    } catch {
      return `<div class="ai-empty">Analysis unavailable.</div>`;
    }

    const chips = [];

    // Score badge — shown first so it's the fastest thing to scan.
    const score = analysis.overall_score;
    if (score !== undefined && score !== null) {
      const pct = Math.round(typeof score === 'number' && score <= 1 ? score * 100 : score);
      const scoreColor = pct >= 70 ? '#86efac' : pct >= 45 ? '#fcd34d' : '#fca5a5';
      const scoreBg    = pct >= 70 ? '#0f2a1a' : pct >= 45 ? '#2a1f00' : '#3b0f0f';
      const scoreBdr   = pct >= 70 ? '#14532d' : pct >= 45 ? '#78350f' : '#7f1d1d';
      chips.push(`<span class="ai-chip" style="background:${scoreBg};color:${scoreColor};border:1px solid ${scoreBdr};font-weight:700">${pct}%</span>`);
    }

    // Disqualifiers — max 2 (most actionable signal).
    (analysis.disqualifiers || []).slice(0, 2).forEach(d => {
      chips.push(`<span class="ai-chip ai-chip-disqualifier" title="${esc(d)}">✕ ${esc(chipLabel(d))}</span>`);
    });

    // Caution — max 1.
    const cautions = analysis.caution || [];
    if (cautions.length > 0) {
      const c = cautions[0];
      chips.push(`<span class="ai-chip ai-chip-caution" title="${esc(c)}">⚠ ${esc(chipLabel(c))}</span>`);
    }

    // Matched projects — max 1.
    const projects = analysis.matched_projects || [];
    if (projects.length > 0) {
      const p = projects[0];
      chips.push(`<span class="ai-chip ai-chip-match" title="${esc(p)}">✓ ${esc(chipLabel(p))}</span>`);
    }

    if (chips.length === 0) {
      return `<div class="ai-empty">Analysis returned no items.</div>`;
    }

    return `<div class="ai-strip">${chips.join('')}</div>`;
  }

  // ── Tracking: status select + notes ──
  async function updateJob(jobId, payload) {
    try {
      await fetch(`/api/jobs/${encodeURIComponent(jobId)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (err) {
      console.error('updateJob failed:', err);
    }
  }

  function renderStatusSelect(job) {
    const statuses = ['none', 'interested', 'applied', 'interviewing', 'offer', 'rejected', 'dismissed'];
    const labels   = ['— Status —', 'Interested', 'Applied', 'Interviewing', 'Offer', 'Rejected', 'Dismissed'];
    const options = statuses.map((s, i) =>
      `<option value="${s}" ${job.status === s ? 'selected' : ''}>${labels[i]}</option>`
    ).join('');

    return `<select class="status-select" data-status="${esc(job.status)}" data-job-id="${esc(job.id)}" onchange="onStatusChange(this)">
      ${options}
    </select>
    <textarea class="notes-textarea" data-job-id="${esc(job.id)}"
      placeholder="Notes…"
      onblur="onNotesBlur(this)">${esc(job.notes || '')}</textarea>`;
  }

  function onStatusChange(select) {
    const jobId = select.dataset.jobId;
    const newStatus = select.value;
    select.dataset.status = newStatus;

    // Apply dismissed styling to the row immediately
    const row = select.closest('tr');
    if (newStatus === 'dismissed') {
      row.classList.add('dismissed');
    } else {
      row.classList.remove('dismissed');
    }

    updateJob(jobId, { status: newStatus });
  }

  function onNotesBlur(textarea) {
    const jobId = textarea.dataset.jobId;
    updateJob(jobId, { notes: textarea.value });
  }

  // ── Stats ──
  async function loadStats() {
    const res = await fetch('/api/stats');
    const data = await res.json();
    badge.textContent = data.total;

    const discStr = Object.entries(data.disciplines)
      .map(([d, n]) => `<strong>${n}</strong> ${d}`)
      .join(' &middot; ');

    statsStrip.innerHTML = `
      <span>Total: <strong>${data.total}</strong></span>
      <span>${discStr}</span>
      <span style="margin-left:auto">
        <strong>${data.visa}</strong> Visa &nbsp;
        <strong>${data.remote}</strong> Remote
      </span>
    `;
  }

  // ── Jobs ──
  async function loadJobs() {
    spinner.style.display    = 'flex';
    table.style.display      = 'none';
    emptyState.style.display = 'none';
    resultCount.textContent  = '';

    const params = new URLSearchParams({
      q:          searchEl.value.trim(),
      discipline: discEl.value,
      location:   locationEl.value,
      sort:       sortEl.value,
      ...(filters.visa      ? { visa: '1' }       : {}),
      ...(filters.remote    ? { remote: '1' }     : {}),
      ...(showDismissed     ? { dismissed: '1' }  : {}),
    });

    const statusVal = getActivePill('status');
    const daysVal   = getActivePill('days');
    if (statusVal) params.set('status', statusVal);
    if (daysVal)   params.set('days', daysVal);

    const res  = await fetch(`/api/jobs?${params}`);
    const jobs = await res.json();

    spinner.style.display = 'none';

    if (jobs.length === 0) {
      emptyState.style.display = 'block';
      return;
    }

    resultCount.textContent = `Showing ${jobs.length} job${jobs.length !== 1 ? 's' : ''}`;

    tbody.innerHTML = jobs.map((j, i) => `
      <tr class="${j.status === 'dismissed' ? 'dismissed' : ''}">
        <td class="date-cell">${i + 1}</td>
        <td class="job-title">
          <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
          ${j.seen_today ? '<span class="new-badge">New</span>' : ''}
          ${j.snippet ? `<div class="job-snippet">${esc(j.snippet)}</div>` : ''}
          ${renderAnalysis(j.ai_analysis)}
        </td>
        <td><span class="tag tag-discipline">${esc(j.discipline || '—')}</span></td>
        <td>${locationTags(j)}</td>
        <td class="date-cell">${formatDate(j.published)}</td>
        <td class="seen-cell">${esc(j.seen_at)}</td>
        <td class="tracking-cell no-strike">${renderStatusSelect(j)}</td>
        <td class="no-strike">
          <a class="link-btn" href="${esc(j.url)}" target="_blank" rel="noopener">Open ↗</a>
        </td>
      </tr>
    `).join('');

    table.style.display = 'table';
  }

  function scheduleLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadJobs, 250);
  }

  searchEl.addEventListener('input', scheduleLoad);
  discEl.addEventListener('change', loadJobs);
  locationEl.addEventListener('change', loadJobs);
  sortEl.addEventListener('change', loadJobs);

  loadStats();
  loadJobs();
</script>
</body>
</html>
