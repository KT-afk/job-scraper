<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3e;
      --accent:  #6c63ff;
      --accent2: #00d4aa;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --danger:  #ff6b6b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header h1 span { color: var(--accent); }
    #total-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* ── Controls ── */
    .controls {
      padding: 16px 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .controls input,
    .controls select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .controls input { width: 240px; }
    .controls input::placeholder { color: var(--muted); }
    .controls input:focus,
    .controls select:focus { border-color: var(--accent); }
    .controls select option { background: var(--surface); }

    /* toggle buttons */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toggle-btn.active-visa {
      border-color: #f87171;
      background: #2a1414;
      color: #fca5a5;
    }
    .toggle-btn.active-remote {
      border-color: #4ade80;
      background: #0f2a1a;
      color: #86efac;
    }

    .sort-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ── Stats strip ── */
    .stats-strip {
      padding: 10px 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .stats-strip strong { color: var(--accent2); }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      padding: 20px 32px;
    }
    table { width: 100%; border-collapse: collapse; }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface); }
    tbody td { padding: 12px 14px; vertical-align: top; }

    .job-title { font-weight: 600; max-width: 360px; }
    .job-title a { color: var(--text); text-decoration: none; }
    .job-title a:hover { color: var(--accent); }
    .job-snippet {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      max-width: 360px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* tags */
    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      margin: 2px 2px 0 0;
    }
    .tag-discipline { background: #1e1b4b; color: #a5b4fc; }
    .tag-location   { background: #0f2a25; color: #6ee7b7; }
    .tag-remote     { background: #0f2a1a; color: #86efac; }
    .tag-visa       { background: #2a1414; color: #fca5a5; }
    .tag-singapore  { background: #1a2035; color: #7dd3fc; }

    .date-cell  { color: var(--muted); white-space: nowrap; font-size: 12px; }
    .seen-cell  { color: var(--muted); white-space: nowrap; font-size: 11px; }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .link-btn:hover { background: var(--accent); color: #fff; }

    /* result count */
    .result-count { font-size: 12px; color: var(--muted); padding: 0 32px 10px; }

    /* ── Empty / loading ── */
    .empty { text-align: center; padding: 80px 0; color: var(--muted); }
    .empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

    .spinner { display: flex; justify-content: center; padding: 60px; }
    .spinner::after {
      content: '';
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1><span>&#9680;</span> Job Board</h1>
  <span id="total-badge">…</span>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Search title or snippet…" />

  <select id="filter-discipline">
    <option value="">All Disciplines</option>
    {% for disc in disciplines %}
    <option value="{{ disc }}">{{ disc }}</option>
    {% endfor %}
  </select>

  <select id="filter-location">
    <option value="">All Locations</option>
    {% for loc in locations %}
    <option value="{{ loc }}">{{ loc }}</option>
    {% endfor %}
  </select>

  <button class="toggle-btn" id="btn-visa"   onclick="toggleFilter('visa')">  Visa Sponsored</button>
  <button class="toggle-btn" id="btn-remote" onclick="toggleFilter('remote')"> Remote</button>

  <div class="sort-group">
    Sort
    <select id="sort-select">
      <option value="date">Newest first</option>
      <option value="title">Title A–Z</option>
    </select>
  </div>
</div>

<div class="stats-strip" id="stats-strip">Loading…</div>
<div class="result-count" id="result-count"></div>

<div class="table-wrap">
  <div class="spinner" id="spinner"></div>
  <table id="jobs-table" style="display:none">
    <thead>
      <tr>
        <th>#</th>
        <th>Job</th>
        <th>Discipline</th>
        <th>Tags</th>
        <th>Published</th>
        <th>Seen</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="jobs-body"></tbody>
  </table>
  <div class="empty" id="empty-state" style="display:none">
    <h2>No jobs found</h2>
    <p>Try adjusting your filters.</p>
  </div>
</div>

<script>
  const searchEl    = document.getElementById('search');
  const discEl      = document.getElementById('filter-discipline');
  const locationEl  = document.getElementById('filter-location');
  const sortEl      = document.getElementById('sort-select');
  const tbody       = document.getElementById('jobs-body');
  const table       = document.getElementById('jobs-table');
  const spinner     = document.getElementById('spinner');
  const emptyState  = document.getElementById('empty-state');
  const badge       = document.getElementById('total-badge');
  const statsStrip  = document.getElementById('stats-strip');
  const resultCount = document.getElementById('result-count');

  let filters = { visa: false, remote: false };
  let debounceTimer = null;

  function toggleFilter(key) {
    filters[key] = !filters[key];
    const btn = document.getElementById(`btn-${key}`);
    btn.classList.toggle(`active-${key}`, filters[key]);
    loadJobs();
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function locationTags(job) {
    const tags = [];
    const loc = (job.location || '').toLowerCase();
    if (loc === 'singapore' || loc.includes('singapore')) {
      tags.push('<span class="tag tag-singapore">Singapore</span>');
    } else if (loc.includes('visa')) {
      // handled by visa badge below
    } else if (loc !== 'remote') {
      tags.push(`<span class="tag tag-location">${esc(job.location)}</span>`);
    }
    if (job.visa_sponsored) tags.push('<span class="tag tag-visa">Visa Sponsor</span>');
    if (job.remote_ok)      tags.push('<span class="tag tag-remote">Remote</span>');
    return tags.join(' ');
  }

  function formatDate(d) {
    if (!d) return '<span style="color:var(--border)">—</span>';
    return esc(d.slice(0, 10));
  }

  async function loadStats() {
    const res = await fetch('/api/stats');
    const data = await res.json();
    badge.textContent = data.total;

    const discStr = Object.entries(data.disciplines)
      .map(([d, n]) => `<strong>${n}</strong> ${d}`)
      .join(' &middot; ');

    statsStrip.innerHTML = `
      <span>Total: <strong>${data.total}</strong></span>
      <span>${discStr}</span>
      <span style="margin-left:auto">
        <strong>${data.visa}</strong> Visa &nbsp;
        <strong>${data.remote}</strong> Remote
      </span>
    `;
  }

  async function loadJobs() {
    spinner.style.display    = 'flex';
    table.style.display      = 'none';
    emptyState.style.display = 'none';
    resultCount.textContent  = '';

    const params = new URLSearchParams({
      q:          searchEl.value.trim(),
      discipline: discEl.value,
      location:   locationEl.value,
      sort:       sortEl.value,
      ...(filters.visa   ? { visa: '1' }   : {}),
      ...(filters.remote ? { remote: '1' } : {}),
    });

    const res  = await fetch(`/api/jobs?${params}`);
    const jobs = await res.json();

    spinner.style.display = 'none';

    if (jobs.length === 0) {
      emptyState.style.display = 'block';
      return;
    }

    resultCount.textContent = `Showing ${jobs.length} job${jobs.length !== 1 ? 's' : ''}`;

    tbody.innerHTML = jobs.map((j, i) => `
      <tr>
        <td class="date-cell">${i + 1}</td>
        <td class="job-title">
          <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
          ${j.snippet ? `<div class="job-snippet">${esc(j.snippet)}</div>` : ''}
        </td>
        <td><span class="tag tag-discipline">${esc(j.discipline || '—')}</span></td>
        <td>${locationTags(j)}</td>
        <td class="date-cell">${formatDate(j.published)}</td>
        <td class="seen-cell">${esc(j.seen_at)}</td>
        <td>
          <a class="link-btn" href="${esc(j.url)}" target="_blank" rel="noopener">Open ↗</a>
        </td>
      </tr>
    `).join('');

    table.style.display = 'table';
  }

  function scheduleLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadJobs, 250);
  }

  searchEl.addEventListener('input', scheduleLoad);
  discEl.addEventListener('change', loadJobs);
  locationEl.addEventListener('change', loadJobs);
  sortEl.addEventListener('change', loadJobs);

  loadStats();
  loadJobs();
</script>
</body>
</html>
